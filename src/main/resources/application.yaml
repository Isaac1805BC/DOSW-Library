# Profile-specific configuration for relational (PostgreSQL) and mongo (MongoDB Atlas).

# Usage:
# - Keep existing PostgreSQL settings in application.properties (current defaults).
# - Activate a profile with `-Dspring.profiles.active=relational` or `mongo`.

spring:
	profiles: "relational"

---

spring:
	profiles: relational
	datasource:
		url: jdbc:postgresql://localhost:5432/biblioteca_db
		username: postgres
		password: isa1805fl
		driver-class-name: org.postgresql.Driver
	jpa:
		hibernate:
			ddl-auto: create-drop
		properties:
			hibernate:
				dialect: org.hibernate.dialect.PostgreSQLDialect
		show-sql: true

---

spring:
	profiles: mongo
	data:
		mongodb:
			# Replace the placeholders below with your MongoDB Atlas connection values.
			uri: mongodb+srv://<username>:<password>@<cluster-address>/<database>?retryWrites=true&w=majority

# JWT and common configuration can remain in application.properties to be shared across profiles.
